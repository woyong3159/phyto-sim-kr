name: 검증 및 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 단위 테스트 (Vitest)
        run: npm test
      - name: 빌드 (타입 검사 포함)
        run: npm run build
      - name: WebKit 설치
        run: npx playwright install --with-deps webkit
      - name: 화면 테스트 (Playwright WebKit, iPhone 에뮬레이션)
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: 스크린샷 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: test-results
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
